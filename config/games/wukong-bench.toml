# Black Myth: Wukong Benchmark Tool -- free standalone Steam benchmark,
# high-gain cohort candidate. UE5 + vkd3d-proton.
#
# appid 3132990 verified via Steam store search (2026-07-16):
# https://store.steampowered.com/app/3132990/Black_Myth_Wukong_Benchmark_Tool/
# (2358720 is the base game's appid, not the benchmark tool -- do not confuse
# the two; the benchmark tool is a separate free Steam app.)

[game]
slug = "wukong-bench"
name = "Black Myth: Wukong Benchmark Tool"
kind = "steam"
appid = 3132990
runtime = "proton"
api = "vkd3d"
engine = "Unreal Engine 5"
cohort = "high-gain"

[benchmark]
type = "standalone"
trigger = "autostart"
launch_args = []
duration_hint_s = 180
instructions = """
The benchmark tool autostarts its scripted camera sequence on launch; no
menu navigation is required. Let it run to completion once per profile.
"""

[foz]
cache_glob = "steamapps/shadercache/{appid}/fozpipelinesv6/steamapprun_pipeline_cache.*"

[[scenes]]
id = "builtin_benchmark"
kind = "benchmark"
protocol_doc = "docs/scenes/wukong-bench_builtin_benchmark.md"
