# vkpeak -- Tier-0 synthetic, measures peak Vulkan compute/graphics
# throughput (FLOPs, bandwidth). appid intentionally omitted: native-cli.

[game]
slug = "vkpeak"
name = "vkpeak"
kind = "native-cli"
runtime = "native"
api = "vulkan"
engine = ""
cohort = "synthetic"

[benchmark]
type = "cli"
trigger = "cli-args"
launch_args = []
duration_hint_s = 60
instructions = """
Fully automated: `vkpeak` runs its microbenchmark suite and prints peak
throughput numbers on exit. Not packaged for most distros -- build from
source into tools/ (doctor flags it if missing).
"""

[foz]
cache_glob = ""  # native-cli: no Steam shadercache

[[scenes]]
id = "default"
kind = "benchmark"
protocol_doc = "docs/scenes/vkpeak_default.md"
