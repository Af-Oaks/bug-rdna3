# Tom Clancy's Rainbow Six Siege -- appid 359550, verified present in the local Steam shadercache
# on 2026-07-28. Installed in TWO libraries; both shadercaches were collected. API not verified (Siege ships a native Vulkan renderer, but which one recorded this is unconfirmed).
[game]
slug = "r6siege"
name = "Tom Clancy's Rainbow Six Siege"
kind = "steam"
appid = 359550
runtime = "proton"
engine = "AnvilNext"
api = "unknown"  # TODO verify
# cohort NOT yet measured -- set only after a real gen-over-gen A/B.
cohort = "unclassified"

[benchmark]
type = "manual-scene"
trigger = "menu"
launch_args = []
duration_hint_s = 180
instructions = """
Corpus source only: this entry exists so the recorded pipeline cache can be
collected and replayed. No capture protocol has been defined for this title.
"""

[foz]
# Matches both layouts (flat fozpipelinesv6/*.foz and the nested
# steamapprun_pipeline_cache.<hex>/ directories). Files only.
cache_glob = "steamapps/shadercache/{appid}/fozpipelinesv6/**/*pipeline_cache*"
