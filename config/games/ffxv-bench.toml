# FINAL FANTASY XV Windows Edition benchmark -- free standalone tool, not on
# Steam. Not launched via `steam -applaunch`; run directly through Proton as
# a non-Steam executable.
#
# SETUP (one-time, human): download the benchmark from the official Square
# Enix benchmark page, extract it, and set exe_path below to the extracted
# FFXV_Benchmark.exe (or equivalent launcher exe). Pick a Proton version in
# `runtime` notes / docs/GAMES.md once chosen.

[game]
slug = "ffxv-bench"
name = "FINAL FANTASY XV Windows Edition Benchmark"
kind = "non-steam-proton"
# appid intentionally omitted: not a Steam title, so there is no appid.
runtime = "proton"
api = "dxvk"
engine = "Luminous"
# TODO: placeholder -- set to the real path after the one-time download/extract.
exe_path = "tools/ffxv-bench/FFXV_Benchmark.exe"
# TODO cohort: no gain data collected yet for this title; verify empirically.
cohort = "high-gain"

[benchmark]
type = "standalone"
trigger = "autostart"
launch_args = []
duration_hint_s = 240
instructions = """
Download the FFXV benchmark tool, extract to the path in exe_path, and
launch it through Proton (non-Steam game entry or a direct `proton run`
invocation -- see docs/GAMES.md once written, Phase 3/6). The benchmark
autostarts its scripted sequence; the launcher window may require an
Enter-to-continue at the end since --wait can be unreliable for Proton
launcher layers.
"""

[foz]
cache_glob = ""  # non-steam-proton: no Steam shadercache path; foz location TBD in Phase 3/6

[[scenes]]
id = "builtin_benchmark"
kind = "benchmark"
protocol_doc = "docs/scenes/ffxv-bench_builtin_benchmark.md"
