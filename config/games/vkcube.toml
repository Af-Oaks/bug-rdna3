# vkcube -- trivial native Vulkan test app, already on PATH (/usr/bin/vkcube).
# Not part of the thesis game matrix; used as the Phase 3 armed-launch smoke
# test target (prove ICD swap + one-shot consumption via bin/tcc-launch.sh
# before ever touching a real Steam game). appid intentionally omitted.

[game]
slug = "vkcube"
name = "vkcube"
kind = "native-cli"
runtime = "native"
api = "vulkan"
engine = ""
cohort = "synthetic"

[benchmark]
type = "cli"
trigger = "cli-args"
launch_args = []
duration_hint_s = 10
instructions = """
`tcc arm --profile custom && bin/tcc-launch.sh vkcube` -- confirm the
launch log shows the custom ICD applied and the one-shot armed profile
consumed. vkcube prints its Vulkan device name/driver on stdout, which
doubles as a stock-vs-custom load confirmation.
"""

[foz]
cache_glob = ""  # native-cli: no Steam shadercache

[[scenes]]
id = "default"
kind = "benchmark"
protocol_doc = "docs/scenes/vkcube_default.md"
